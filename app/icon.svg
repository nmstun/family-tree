<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- アプリのロゴ（ログイン画面とヘッダーの黒い角丸四角の中身）と同じ図柄にする。
       lucide-react の Network アイコンを、24pxのグリッドから64pxへ2倍に写して描き起こしたもの。
       線幅だけは lucide 既定の2倍相当（4.0）ではなく4.5にしてある。16px表示では4.0だと
       1pxを割って線が薄れるため -->
  <rect width="64" height="64" fill="#171717"/>
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="12" width="12" height="12" rx="2"/>
    <rect x="12" y="40" width="12" height="12" rx="2"/>
    <rect x="40" y="40" width="12" height="12" rx="2"/>
    <path d="M18 40v-6a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v6"/>
    <path d="M32 32v-8"/>
  </g>
</svg>
